# 3時間ごとに本番の収集・要約を起動する（Vercel Hobbyのcron制限を補う）
# GitHub の Settings → Secrets and variables → Actions に以下を登録:
#   SITE_URL     例: https://ai-intel.vercel.app
#   CRON_SECRET  Vercelに設定したものと同じ値
name: ingest
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET 未設定のためスキップ"; exit 0; fi
          curl -fsS --max-time 310 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/ingest"
